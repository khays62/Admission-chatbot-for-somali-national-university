<!doctype html>
<html lang="so">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SNU Admission Assistant</title>
    <style>
      :root {
        --bg: #eef2f7;
        --panel: #ffffff;
        --primary: #1d4ed8;
        --primary-soft: #dbeafe;
        --bot: #edf4ff;
        --user: #eafaf1;
        --text: #1f2937;
        --muted: #6b7280;
        --chip: #f3f4f6;
        --border: #dfe6ef;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .chat-shell {
        width: min(980px, 100%);
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
        border: 1px solid var(--border);
        padding: 20px;
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .brand {
        font-size: 2rem;
        font-weight: 700;
        margin: 0;
      }

      .status-pill {
        background: #e0f2fe;
        color: #0f766e;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      #chat-box {
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 14px;
        min-height: 260px;
        max-height: 420px;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 80%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.5;
        word-wrap: break-word;
      }

      .message.bot {
        background: var(--bot);
        align-self: flex-start;
        border-top-left-radius: 4px;
      }

      .message.user {
        background: var(--user);
        align-self: flex-end;
        border-top-right-radius: 4px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
        margin-bottom: 16px;
      }

      .chip {
        border: 1px solid var(--border);
        background: var(--chip);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: 0.2s ease;
      }

      .chip:hover {
        background: #e5e7eb;
      }

      .composer {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      textarea {
        flex: 1;
        resize: vertical;
        min-height: 54px;
        max-height: 150px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
      }

      button.send {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button.send:hover {
        background: #1e40af;
      }

      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="chat-shell">
        <div class="chat-header">
          <h1 class="brand">Admission Assistant</h1>
          <span class="status-pill">Live support</span>
        </div>

        <div id="chat-box"></div>

        <div class="actions">
          <button class="chip" data-message="Sideen isku diiwaan gelin karaa?">Isdiiwaan gelin</button>
          <button class="chip" data-message="Maxaa dokumenti ah oo la rabaa?">Dokumentiyada</button>
          <button class="chip" data-message="Lacagta codsiga goorma ayaan bixiyaa?">Lacag bixinta</button>
          <button class="chip" data-message="Xarunta iyo goobta imtixaanka waa maxay?">Xarunta</button>
        </div>

        <div class="composer">
          <textarea id="message-input" placeholder="Fadlan qoraalka su'aashaada..."></textarea>
          <button class="send" id="send-btn">Dir</button>
        </div>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById('chat-box');
      const input = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');

      function addMessage(text, type = 'bot') {
        const el = document.createElement('div');
        el.className = 'message ' + type;
        el.textContent = text;
        chatBox.appendChild(el);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function showTypingIndicator() {
        const indicator = document.createElement('div');
        indicator.className = 'message bot typing';
        indicator.textContent = 'Waxaa ku qorayaa...';
        indicator.id = 'typing-indicator';
        chatBox.appendChild(indicator);
        chatBox.scrollTop = chatBox.scrollHeight;
        return indicator;
      }

      function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
      }

      async function sendMessage(messageText) {
        const text = messageText.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        showTypingIndicator();

        try {
          const response = await fetch('/api/chat/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });

          const data = await response.json();
          removeTypingIndicator();

          const statusText = data.provider_status && data.provider_status.fallback_used
            ? ' (fallback oo la isticmaalay — model-ka wuu xaddidan yahay)' : '';

          addMessage((data.chatbot_response || 'Ma haysto jawaab.') + statusText, 'bot');
        } catch (error) {
          removeTypingIndicator();
          addMessage('Waxaa jira qalad. Fadlan isku day mar kale.', 'bot');
        }
      }

      sendBtn.addEventListener('click', () => {
        sendMessage(input.value);
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage(input.value);
        }
      });

      document.querySelectorAll('.chip').forEach(button => {
        button.addEventListener('click', () => sendMessage(button.dataset.message));
      });

      addMessage('Ku soo dhawoow! Waxaan kaa caawin karaa su’aalaha admission-ka.', 'bot');
    </script>
  </body>
</html>
